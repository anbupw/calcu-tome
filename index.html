<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kalkulator Tome Perfect World - Edisi Imersif" />
<title>Kalkulator Tome</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="header-main">
            <h1><i class="fa-solid fa-book-atlas"></i> <span data-lang="title">Kalkulator Tome</span></h1>
            <p class="subtitle" data-lang="subtitle">Perfect World Mobile — Edisi Imersif</p>
        </div>
        <div class="header-controls">
            <div class="lang-selector">
                <button onclick="setLanguage('id')" id="lang-id" class="lang-btn active">ID</button>
                <button onclick="setLanguage('en')" id="lang-en" class="lang-btn">EN</button>
                <button onclick="setLanguage('ru')" id="lang-ru" class="lang-btn">RU</button>
            </div>
            <button onclick="resetCalculator()" class="btn btn-danger" title="Reset Data">
                <i class="fa-solid fa-rotate-left"></i> <span data-lang="btnReset">Reset</span>
            </button>
        </div>
    </header>

    <div class="main-grid">
        <aside class="panel-left">
            <section class="card border-accent">
                <h2 class="card-title"><i class="fa-solid fa-coins text-accent"></i> <span data-lang="marketPrices">Harga Pasar Bahan Dasar</span></h2>
                <div class="price-inputs">
                    <div class="input-group">
                        <label for="price10"><i class="fa-solid fa-scroll text-muted"></i> <span data-lang="itemLevel1">Tome Frag. Lvl 1</span></label>
                        <div class="input-wrapper">
                            <input type="number" id="price10" value="0" min="0" oninput="updatePrices()">
                            <span class="currency-badge">Gold</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="price11"><i class="fa-solid fa-feather text-muted"></i> <span data-lang="itemLevel2">Tome Frag. Lvl 2</span></label>
                        <div class="input-wrapper">
                            <input type="number" id="price11" value="0" min="0" oninput="updatePrices()">
                            <span class="currency-badge">Gold</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="price12"><i class="fa-solid fa-gem text-muted"></i> <span data-lang="itemLevel3">Tome Frag. Lvl 3</span></label>
                        <div class="input-wrapper">
                            <input type="number" id="price12" value="0" min="0" oninput="updatePrices()">
                            <span class="currency-badge">Gold</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="control-row">
                    <div class="input-group flex-1">
                        <label for="mnojitel"><i class="fa-solid fa-layer-group text-muted"></i> <span data-lang="labelQuantity">Jumlah Pembuatan</span></label>
                        <input type="number" id="mnojitel" value="1" min="1" oninput="updateMultiplier()">
                    </div>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Cari nama Tome..." oninput="filterTomes()">
                    <button id="clear-search" onclick="clearSearch()" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </section>

            <section class="card flex-1 list-card">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab(3)">Lvl 3</button>
                    <button class="tab-btn" onclick="switchTab(4)">Lvl 4</button>
                    <button class="tab-btn" onclick="switchTab(5)">Lvl 5</button>
                    <button class="tab-btn" onclick="switchTab(6)">Lvl 6</button>
                </div>
                <div id="tome-list" class="tome-list-container">
                    </div>
            </section>
        </aside>

        <main class="panel-right">
            <section class="card tree-card">
                <div class="tree-header">
                    <h2 class="card-title"><i class="fa-solid fa-network-wired text-accent"></i> <span data-lang="craftingTree">Pohon Struktur Crafting</span></h2>
                    <div id="target-tome-display" class="target-badge">Pilih Tome Terlebih Dahulu</div>
                </div>
                
                <div class="tree-wrapper">
                    <div id="tree-root" class="tree-container">
                        </div>
                </div>

                <div class="summary-bar" id="summary-bar">
                    <div class="summary-item">
                        <span class="summary-label" data-lang="totalCost">Total Biaya Belanja Pasar:</span>
                        <span class="summary-value" id="total-cost-display">0 Gold</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<footer class="app-footer-credit">
    <p>&copy; 2026 Kalkulator Tome - Edisi Imersif Berstruktur. Built with ❤️</p>
</footer>

<script src="script.js" defer></script>
</body>
</html>
