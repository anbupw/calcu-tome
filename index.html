<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tome Calculator - Modern Edition" />
<title>Tome Calculator | Modern UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================
   1. GLOBAL VARIABLES & RESET
========================================= */
:root {
	--bg-main: #0f172a;          /* Biru Dongker Gelap */
	--bg-card: #1e293b;          /* Warna Kartu */
	--bg-card-hover: #334155;    
	--text-main: #f8fafc;        /* Putih Terang */
	--text-muted: #94a3b8;       /* Abu-abu Terang */
	--accent: #3b82f6;           /* Biru Elektrik (Utama) */
	--accent-hover: #2563eb;
	--danger: #ef4444;           /* Merah untuk tombol Hapus/Kurang */
	--border-color: rgba(255, 255, 255, 0.08);
}

* {
	box-sizing: border-box;
	margin: 0; padding: 0;
}

body {
	font-family: 'Inter', sans-serif;
	background-color: var(--bg-main);
	color: var(--text-main);
	line-height: 1.6;
	min-height: 100vh;
	padding: 30px;
	background-image: 
		radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
		radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
	background-attachment: fixed;
}

ul { list-style: none; }
a { color: var(--accent); text-decoration: none; transition: 0.3s; }
a:hover { color: #60a5fa; text-decoration: underline; }

/* =========================================
   2. LAYOUT & CONTAINERS
========================================= */
.obertka {
	display: flex;
	flex-wrap: wrap;
	gap: 24px;
	justify-content: center;
	max-width: 1400px;
	margin: 0 auto;
}

.drevo {
	background: var(--bg-card);
	border: 1px solid var(--border-color);
	border-radius: 20px;
	padding: 25px;
	width: 100%;
	max-width: 480px;
	box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
	position: relative;
	backdrop-filter: blur(10px);
}

#vychet {
	max-width: 985px;
	margin: 24px auto 0;
}
#vychet .drevo {
	max-width: 100%;
}

/* =========================================
   3. TYPOGRAPHY & HEADERS
========================================= */
h1, h2 {
	font-size: 1.25rem;
	font-weight: 700;
	color: #e2e8f0;
	margin-bottom: 20px;
	display: flex;
	align-items: center;
	gap: 10px;
}
h1::before, h2::before {
	content: '';
	display: inline-block;
	width: 12px;
	height: 12px;
	background: var(--accent);
	border-radius: 3px;
}

.podzagolovok {
	display: flex;
	align-items: center;
	gap: 12px;
	margin-bottom: 20px;
	background: rgba(0,0,0,0.2);
	padding: 12px 16px;
	border-radius: 12px;
	border: 1px solid var(--border-color);
	font-size: 0.9rem;
	color: var(--text-muted);
	min-height: 50px;
}

/* =========================================
   4. FORM ELEMENTS
========================================= */
.podzagolovok input {
	background: #0f172a;
	border: 1px solid #475569;
	color: white;
	font-weight: 600;
	border-radius: 8px;
	padding: 8px 12px;
	width: 70px;
	text-align: center;
	font-size: 1rem;
	outline: none;
	transition: border 0.3s;
}
.podzagolovok input:focus {
	border-color: var(--accent);
}

.podzagolovok button {
	background: var(--accent);
	color: white;
	border: none;
	padding: 9px 18px;
	border-radius: 8px;
	font-weight: 600;
	font-size: 0.9rem;
	cursor: pointer;
	transition: all 0.2s ease;
	box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
}
.podzagolovok button:hover {
	background: var(--accent-hover);
	transform: translateY(-2px);
	box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.5);
}
.podzagolovok button:active {
	transform: translateY(0);
}

/* =========================================
   5. TREE LIST (ICONS & BADGES)
========================================= */
.vetv ul {
	display: flex;
	flex-wrap: wrap;
	gap: 15px;
	background: rgba(255, 255, 255, 0.02);
	border: 1px solid var(--border-color);
	border-radius: 16px;
	padding: 16px;
	margin-bottom: 16px;
	align-items: center;
}

/* Level Indicator */
.vetv ul li:first-child {
	width: 100%;
	font-size: 0.75rem;
	font-weight: 700;
	color: var(--text-muted);
	text-transform: uppercase;
	letter-spacing: 1.5px;
	border-bottom: 1px dashed var(--border-color);
	padding-bottom: 8px;
	margin-bottom: 5px;
}

/* Item Container */
.vetv ul li {
	position: relative;
	display: inline-flex;
	flex-direction: column;
	align-items: center;
}

/* The Icon Button */
.vetv li button {
	display: block;
	width: 32px; height: 32px;
	background-image: url('znachki.png');
	/* background-repeat: no-repeat; -> DIHAPUS agar sprite sheet bekerja seperti versi aslinya */
	border: none;
	border-radius: 6px;
	cursor: pointer;
	box-shadow: 0 4px 6px rgba(0,0,0,0.3);
	transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.vetv li button:hover {
	transform: scale(1.15) translateY(-2px);
	box-shadow: 0 8px 15px rgba(0,0,0,0.5);
}

/* The Multiplier Badge (x5) */
.vetv li b {
	position: absolute;
	bottom: -8px;
	right: -10px;
	background: var(--accent);
	color: #fff;
	font-size: 0.7rem;
	font-weight: 700;
	padding: 2px 6px;
	border-radius: 12px;
	border: 2px solid var(--bg-card);
	pointer-events: none;
	z-index: 2;
}

/* The Hidden "Minus/Action" Button on Hover */
.vetv li span {
	position: absolute;
	top: -8px;
	left: -8px;
	width: 18px;
	height: 18px;
	background: var(--danger);
	color: white;
	font-size: 14px;
	line-height: 14px;
	text-align: center;
	border-radius: 50%;
	cursor: pointer;
	opacity: 0;
	visibility: hidden;
	transition: all 0.2s ease;
	z-index: 3;
	border: 2px solid var(--bg-card);
	display: flex;
	align-items: center;
	justify-content: center;
}
.vetv li span::before {
	content: "-";
	font-weight: bold;
}
.vetv li:hover span {
	opacity: 1;
	visibility: visible;
}

#strelki { color: var(--accent); font-weight: bold; letter-spacing: 2px; }
#niz li:first-child { display: none; } /* Sembunyikan label kosong di baris bawah */

/* =========================================
   6. FLOATING SELECTION PANEL (RIGHT)
========================================= */
.vybor {
	position: fixed;
	right: 30px;
	top: 30px;
	background: rgba(15, 23, 42, 0.95);
	backdrop-filter: blur(10px);
	border: 1px solid var(--accent);
	padding: 20px;
	border-radius: 16px;
	box-shadow: 0 20px 40px rgba(0,0,0,0.6);
	z-index: 1000;
	max-width: 320px;
	max-height: 80vh;
	overflow-y: auto;
}
.vybor > button {
	width: 100%;
	background: var(--accent);
	border: none;
	color: white;
	padding: 10px;
	border-radius: 8px;
	font-weight: 600;
	cursor: pointer;
	margin-bottom: 15px;
	transition: 0.2s;
}
.vybor > button:hover {
	background: var(--accent-hover);
}
#vybor h4 {
	font-size: 0.8rem;
	color: var(--text-muted);
	border-bottom: 1px solid var(--border-color);
	margin-bottom: 10px;
	padding-bottom: 5px;
	margin-top: 15px;
}
#vybor ul {
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}
#vybor li {
	display: inline-block;
}

/* Custom Scrollbar for Vybor */
.vybor::-webkit-scrollbar { width: 6px; }
.vybor::-webkit-scrollbar-track { background: transparent; }
.vybor::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
</style>
</head>
<body>
<div class="obertka">
	<div class="drevo">
		<h1>Full tree</h1>
		<div class="podzagolovok" id="nazvaniye">Arahkan kursor ke ikon untuk melihat nama item.</div>
		<div id="rawr" class="vetv"></div>
	</div>
	
	<div class="drevo">
		<h2>Individual branch</h2>
		<div class="podzagolovok">
			<input type="text" id="mnojitel" value="1">
			<button onClick="drevo(vetka,true)">Calculate Quantity</button>
		</div>
		<div id="rawrRawr" class="vetv"></div>
	</div>
</div>

<div id="vychet">
	<div class="drevo">
		<h2>Already existing chapters</h2>
		<div class="podzagolovok" id="nazvaniye_vychet">Bahan yang Anda klik (minus) akan masuk ke sini dan dikurangi dari total.</div>
		<div id="rawrRawrRawr" class="vetv"></div>
	</div>
</div>

<div class="vybor">
	<button onClick="var zu = vyborDiv.style.display; vyborDiv.style.display = (zu == 'none') ? 'block' : 'none';" title="Show/hide the selection window">Tract Selection (Pilih Buku)</button>

		</div>
</div>

<script>

var schet;
var str='';

function nazv(t){
	var iii = t.title*1;
	var txt = '<a href="http://www.pwdatabase.com/pwi/items/'+i[iii][3]+'" target="_blank">► '+i[iii][4]+'</a>';
	nazvDiv.innerHTML = txt;
}
function shelk(t){
	mnojInput.value = t.value*1;
	drevo(t.title*1,true);
}
function zachest(e,sw){
	if(!sw) vychet[e] = 0;
	drevo(derevo);
	if(e == vetka) mnojInput.value = schet[e];
	drevo(vetka,true);
	vychtennoe();
	scryt.visibility = 'visible';
}
function okno(e,t){
	var butt = t.parentNode.getElementsByTagName('button')[0].value;
	var uje = prompt('Berapa banyak yang ingin dikurangi?', butt)*1;
	if(uje){
		if(!vychet[e]) vychet[e]=0;
		vychet[e] += uje;
		zachest(e,true);
	}
}
function vychtennoe_html(e){
	var deystv ='onClick="shelk(this)"';
	if(e==12 || e==11 || e==10) deystv = '';
	return '<li><span onClick="zachest('+e+');" title="Kembalikan / Hapus"></span><button style="'+sdvig(e)+'" value="'+vychet[e]+'" title="'+e+'" '+deystv+' onMouseOver="nazv(this);"></button><b>×'+vychet[e]+'</b></li>';
}
function vychtennoe(){
	var txt = '';
	var lis = '';
	if(vychet[11]) lis +=vychtennoe_html(11);
	if(vychet[12]) lis +=vychtennoe_html(12);
	if(vychet[10]) lis +=vychtennoe_html(10);
	if(lis!='') txt += '<ul><li>Base Material</li> '+lis+'</ul>';
	for(var r=1; r<=6; r++){
		lis = '';
		var nach = r*100+1;
		var konec = r*100+16;
		for(var e = nach; e<=konec; e++){
			if(vychet[e]){
				lis += vychtennoe_html(e);
			}
		}
		if(lis!='') txt += '<ul><li>Level '+r+'</li> '+lis+'</ul>';
	}
	vychetDiv.innerHTML = txt;
}

function okno_vybora(){
	var txt = '';
	for(var r=6; r>=1; r--){
		var lis = '';
		var nach = r*100+1;
		var konec = r*100+16;
		for(var e = nach; e<=konec; e++){
			if(i[e]){
				lis +='<li><button style="'+sdvig(e)+'" title="'+e+'" onClick="drevo(this.title)" onMouseOver="nazv(this);"></button></li>';
			}
		}
		txt += '<h4>Level '+r+'</h4><ul> '+lis+'</ul>';
	}
	vyborDiv.innerHTML = txt;
}
okno_vybora();

// INI KODE YANG DIKEMBALIKAN KE VERSI ORISINAL ANDA
function sdvig(iii){
	iii = parseInt(iii);
	switch(iii){
		case 10:
			return(' background-position:32px -32px');
		break;
		case 11:
			return(' background-position:64px 0px');
		break;
		case 12:
			return(' background-position:32px 0px');
		break;
	}
	var ryad = Math.floor(iii/100); 
	var num = iii - (ryad*100);
	return(' background-position:-'+(32*(num-1))+'px -'+(32*(ryad-1))+'px');
}

function w_html(e){
	var deystv ='onClick="shelk(this)"';
	if(e==12 || e==11 || e==10) deystv = '';
	return '<li><span onClick="okno('+e+',this);" title="Kurangi bagian yang sudah ada"></span><button style="'+sdvig(e)+'" value="'+schet[e]+'" title="'+e+'" '+deystv+' onMouseOver="nazv(this);"></button><b>×'+schet[e]+'</b></li>';
}

function w(){
	var txt = '';
	for(var r=6; r>=1; r--){
		var nach = r*100+1;
		var konec = r*100+16;
		var hasItem = false;
		var tempTxt = '<ul><li>Level '+r+'</li> ';
		for(var e = nach; e<=konec; e++){
			if(schet[e]){
				tempTxt +=w_html(e);
				hasItem = true;
			}
		}
		tempTxt += '</ul>';
		if(hasItem) txt += tempTxt;
	}
	
	txt += '<ul id="niz"><li>Base Material</li> ';
	if(schet[11]) txt +=w_html(11);
	if(schet[12]) txt +=w_html(12);
	if(schet[10]) txt +='<li id="strelki" style="margin: 0 10px;">→</li>'+w_html(10);
	txt += '</ul>';
	
	document.getElementById(rawr?'rawrRawr':'rawr').innerHTML = txt;
}
function reDrevo(e){
	if(!schet[e])schet[e]=0;
	if(vychetCopy[e] && vychetCopy[e]>0)vychetCopy[e]--;
	else {
		schet[e]++;
		if(e>200){ reDrevo(i[e][0]); reDrevo(i[e][1]); reDrevo(i[e][2]); }
	}
}

function drevo(e,k){
	rawr=k;
	mnoj = 1;
	schet = [];
	str='';
	vychetCopy = vychet.slice();
	if(rawr){
		vetka = e;
		mnoj = mnojInput.value*1;
		if(vychet[e])mnoj +=vychet[e];
	} else derevo = e;
	
	for(var z=1; z<=mnoj; z++) reDrevo(e);
	
	var znach = 0;
	for(var z=101; z<=109; z++) if(schet[z]) znach += schet[z]*3;
	
	for(var z=12; z>=10; z--){
		switch(z){
			case 10: schet[10] = schet[12]*80;
				break;
			default: schet[z] = znach;
				break;
		}
		if(vychet[z]) schet[z]-= vychet[z]*1;
		if(schet[z]<0) schet[z] = 0;
	}
		
	w();
}

drevo(616);
drevo(515,true);
</script>
