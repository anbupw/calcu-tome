<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Tome Pro & Pembuat Build</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--bg-main);
            padding: 16px;
            border-radius: 12px;
        }

        .control-banner {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: opacity 0.2s ease;
        }

        button:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--accent-red); }
        .btn-success { background-color: var(--accent-green); }
        .btn-secondary { background-color: var(--bg-input); border: 1px solid var(--border-color); }

        select, input[type="number"], input[type="text"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #nazvaniye {
            font-size: 15px;
            color: var(--accent-blue);
            min-height: 24px;
            font-weight: 500;
        }

        .branch ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .branch ul li:first-child {
            font-weight: 600;
            color: var(--text-muted);
            min-width: 80px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .branch ul li {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .branch button {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 6px;
            background-color: #0f172a;
            border: 2px solid var(--border-color);
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 11px;
        }

        .branch button:hover {
            border-color: var(--accent-blue);
        }

        .branch b { font-size: 13px; }

        .branch ul li span {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: var(--accent-red);
            color: white;
            width: 16px;
            height: 16px;
            font-size: 11px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }
        .branch ul li span::before { content: '×'; }
        #deductionsList ul li:hover span { display: flex; }

        .progress-container {
            background-color: var(--bg-input);
            border-radius: 20px;
            height: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text-wrapper {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }

        #floatingTooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-blue);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            z-index: 9999;
            pointer-events: none;
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            min-width: 200px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #vyborDiv {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .menu-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        #bookSearch {
            margin-bottom: 10px;
            width: 100%;
            display: none;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container" id="captureArea">
    
    <div class="control-banner">
        <select id="profileSelect" onchange="handleProfileChange(this.value)"></select>
        <button class="btn-secondary" onclick="createNewProfile()">➕ Profil</button>
        <button class="btn-danger" onclick="removeCurrentProfile()">🗑️</button>
        
        <button id="langBtn" class="btn-secondary" onclick="toggleLanguage()">🌐 Language</button>
        <button id="menuToggleBtn" class="btn-secondary" onclick="toggleBookPanel()">⚙️ Menu Buku</button>
        <button class="btn-success" onclick="openInventoryModal()">📥 Tambah Item Manual</button>
        
        <button class="btn-danger" style="margin-left: auto;" onclick="resetCalculator()">🔄 Reset</button>
    </div>

    <input type="text" id="bookSearch" placeholder="🔍 Cari nama buku..." oninput="filterBooks(this.value)">
    <div id="vyborDiv"></div>

    <div class="workspace">
        <div class="card">
            <div class="card-title">
                <span data-i18n="title2">Target Crafting</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span>Jumlah:</span>
                    <input type="number" id="mnojitel" value="1" min="1" max="99" style="width: 60px; padding: 4px;" oninput="processTree(rightTreeId, true)">
                </div>
            </div>
            <div id="nazvaniye" data-i18n="desc1">Arahkan kursor ke ikon untuk melihat nama buku.</div>
            <div id="rightTree" class="branch"></div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="title1">Kebutuhan Bersih Bahan</div>
            <div id="leftTree" class="branch"></div>
            
            <div class="card-title" data-i18n="title3">Harga Pasar Satuan (Gold)</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Tome Page</label>
                    <input type="number" id="price12" value="100000" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Tome Fragment</label>
                    <input type="number" id="price11" value="50000" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Token of Luck</label>
                    <input type="number" id="price10" value="10000" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
            </div>
            <div class="cost-row">
                <span style="font-weight:600;" data-i18n="totalCostLabel">Estimasi Sisa Biaya:</span>
                <span id="totalCostDisplay" style="color:var(--accent-green); font-weight:700; font-size:18px;">0 Gold</span>
            </div>

            <div class="progress-text-wrapper">
                <span data-i18n="progText">Selesai Dirakit:</span>
                <span id="progressPercentText">0%</span>
            </div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:20px;">
        <div class="card-title" data-i18n="title4">📦 Tas Inventory Anda (Bahan yang Sudah Dimiliki)</div>
        <div id="deductionsList" class="branch"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-secondary" data-i18n="btnShare" onclick="copyShareLink()">🔗 Copy Link Build</button>
            <button class="btn-secondary" data-i18n="btnExport" onclick="exportToImage()">📸 Unduh Gambar Build</button>
        </div>
    </div>

    <div class="footer" data-i18n="footerText">Kalkulator Tome © 2026</div>
</div>

<div id="floatingTooltip"></div>

<div id="inventoryModal" class="modal-overlay" onclick="if(event.target===this) closeInventoryModal();">
    <div class="modal-content" style="max-width: 500px;">
        <h3 data-i18n="modalTitleAdd">Tambah Bahan ke Inventaris</h3>
        <input type="text" id="invSearch" placeholder="Ketik nama item/buku..." oninput="filterInventorySearch(this.value)">
        <div id="invItemList" style="max-height:250px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
        <button class="btn-secondary" onclick="closeInventoryModal()">Tutup</button>
    </div>
</div>

<script>
const LANG = {
    id: { title1: "Kebutuhan Bersih Bahan", title2: "Target Crafting", title3: "Harga Pasar Satuan (Gold)", title4: "📦 Tas Inventory Anda (Bahan yang Sudah Dimiliki)", desc1: "Arahkan kursor ke ikon untuk melihat nama buku.", progText: "Selesai Dirakit:", totalCostLabel: "Estimasi Sisa Biaya:", menuBtnText: "⚙️ Menu Buku", btnShare: "🔗 Copy Link Build", btnExport: "📸 Unduh Gambar Build", modalTitleAdd: "Tambah Bahan ke Inventaris", baseMat: "Bahan Dasar", lvl: "Level", alertCopy: "Link Build berhasil disalin!", footerText: "Kalkulator Tome © 2026" },
    en: { title1: "Net Resource Requirements", title2: "Target Crafting", title3: "Market Unit Price (Gold)", title4: "📦 Your Inventory (Owned Materials)", desc1: "Hover mouse over icons to reveal names.", progText: "Crafting Progress:", totalCostLabel: "Estimated Remaining Cost:", menuBtnText: "⚙️ Book Menu", btnShare: "🔗 Copy Build Link", btnExport: "📸 Download Build Image", modalTitleAdd: "Add Materials to Inventory", baseMat: "Base Mats", lvl: "Level", alertCopy: "Build Link copied successfully!", footerText: "Tome Calculator © 2026" }
};

let currentLang = localStorage.getItem('tomeLang') || 'id';

// Database Resep Buku Tome PWI
const TOME_DB = [];
TOME_DB[616] = [516, 515, 514, 17683, 'Pan Gu Creator'];
TOME_DB[516] = [406, 407, 401, 17682, 'The Voidlands'];
TOME_DB[515] = [406, 407, 401, 17678, 'Gang of Hooligans'];
TOME_DB[514] = [408, 402, 404, 17675, 'Rouge and Red Lips'];
TOME_DB[408] = [301, 304, 302, 17600, 'Battle Tactics'];
TOME_DB[407] = [309, 302, 306, 17614, 'The Weak Stream of Many Miles'];
TOME_DB[406] = [308, 205, 207, 17610, 'The Rivers Edge'];
TOME_DB[402] = [304, 301, 305, 17603, 'Tome of Predestination'];
TOME_DB[401] = [303, 307, 304, 17602, 'Burning Desire'];
TOME_DB[404] = [306, 307, 311, 17605, 'Letters of Social Unrest'];
TOME_DB[301] = [201, 206, 203, 17593, 'Eat Drink and be Merry'];
TOME_DB[302] = [202, 205, 206, 17594, 'Sunset Tales'];
TOME_DB[303] = [207, 203, 202, 17595, 'Adventures and Mishaps'];
TOME_DB[304] = [204, 201, 203, 17596, 'The Sunny Pass'];
TOME_DB[305] = [205, 202, 201, 17597, 'Tales of Beauty'];
TOME_DB[306] = [206, 203, 201, 17598, 'The Bards Wanderlust'];
TOME_DB[307] = [207, 205, 204, 17599, 'A Poets Musings'];
TOME_DB[308] = [208, 202, 204, 17609, 'Decaying Tome'];
TOME_DB[309] = [209, 203, 202, 17613, 'Scene of Carnage'];
TOME_DB[201] = [101, 102, 103, 17584, 'Tome of Water'];
TOME_DB[202] = [102, 103, 104, 17585, 'Tome of Fire'];
TOME_DB[203] = [103, 104, 105, 17586, 'Tome of Earth'];
TOME_DB[204] = [104, 105, 106, 17587, 'Tome of Wood'];
TOME_DB[205] = [105, 106, 107, 17588, 'Tome of Metal'];
TOME_DB[206] = [106, 107, 108, 17589, 'Tome of Wind'];
TOME_DB[207] = [107, 108, 109, 17590, 'Tome of Thunder'];
TOME_DB[208] = [108, 109, 101, 17591, 'Tome of Light'];
TOME_DB[209] = [109, 101, 102, 17592, 'Tome of Darkness'];
TOME_DB[101] = [0, 0, 0, 17001, 'Grace'];
TOME_DB[102] = [0, 0, 0, 17002, 'Power'];
TOME_DB[103] = [0, 0, 0, 17003, 'Courage'];
TOME_DB[104] = [0, 0, 0, 17004, 'Wisdom'];
TOME_DB[105] = [0, 0, 0, 17005, 'Yin'];
TOME_DB[106] = [0, 0, 0, 17006, 'Yang'];
TOME_DB[107] = [0, 0, 0, 17007, 'Life'];
TOME_DB[108] = [0, 0, 0, 17008, 'Death'];
TOME_DB[109] = [0, 0, 0, 17009, 'Void'];

// Item Bahan Baku Mentah Dasar
const RAW_MATS = {
    12: "Tome Page",
    11: "Tome Fragment",
    10: "Token of Luck"
};

let itemCounts = {};
let profiles = JSON.parse(localStorage.getItem('tomeProfiles')) || { 'Default': { targetId: 616, inventory: {} } };
let currentProfile = localStorage.getItem('tomeCurrentProfile') || 'Default';
let rightTreeId = profiles[currentProfile]?.targetId || 616;

function applyLanguage() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (LANG[currentLang][key]) el.innerHTML = LANG[currentLang][key];
    });
    document.getElementById('langBtn').innerText = currentLang === 'id' ? '🌐 Switch to English' : '🌐 Ganti ke Indonesia';
    document.getElementById('menuToggleBtn').innerText = LANG[currentLang]['menuBtnText'];
    processTree(rightTreeId, true);
    renderMenu();
    renderDeductions();
}

function toggleLanguage() {
    currentLang = currentLang === 'id' ? 'en' : 'id';
    localStorage.setItem('tomeLang', currentLang);
    applyLanguage();
}

function showTooltip(element, event) {
    const id = parseInt(element.getAttribute('data-id'));
    const tooltip = document.getElementById('floatingTooltip');
    let name = RAW_MATS[id] || (TOME_DB[id] ? TOME_DB[id][4] : 'Unknown');
    let type = RAW_MATS[id] ? LANG[currentLang]['baseMat'] : `Tome Level ${Math.floor(id/100)}`;
    
    tooltip.innerHTML = `<strong>${name}</strong><br><span style="color:var(--text-muted); font-size:11px;">${type}</span>`;
    tooltip.style.display = 'block';
    moveTooltip(event);
}

function moveTooltip(event) {
    const tooltip = document.getElementById('floatingTooltip');
    tooltip.style.left = (event.clientX + 15) + 'px';
    tooltip.style.top = (event.clientY + 15) + 'px';
}

function hideTooltip() { document.getElementById('floatingTooltip').style.display = 'none'; }

function renderMenu() {
    let div = document.getElementById('vyborDiv');
    let html = '';
    for (let lvl = 6; lvl >= 1; lvl--) {
        html += `<div class="menu-row"><strong>Lvl ${lvl}:</strong>`;
        TOME_DB.forEach((item, index) => {
            if (Math.floor(index / 100) === lvl) {
                html += `<button class="btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="processTree(${index}, true); toggleBookPanel();">${item[4]}</button>`;
            }
        });
        html += `</div>`;
    }
    div.innerHTML = html;
}

function toggleBookPanel() {
    let div = document.getElementById('vyborDiv');
    let searchInput = document.getElementById('bookSearch');
    let isHidden = div.style.display === 'none' || div.style.display === '';
    
    div.style.display = isHidden ? 'block' : 'none';
    searchInput.style.display = isHidden ? 'block' : 'none';
}

// === FUNGSI PENCARIAN (PERBAIKAN BUG) ===
function filterBooks(query) {
    let buttons = document.querySelectorAll('#vyborDiv .menu-row button');
    query = query.toLowerCase();
    buttons.forEach(btn => {
        if (btn.innerText.toLowerCase().includes(query)) {
            btn.style.display = 'inline-block';
        } else {
            btn.style.display = 'none';
        }
    });
}

function filterInventorySearch(query) {
    let items = document.querySelectorAll('#invItemList button');
    query = query.toLowerCase();
    items.forEach(btn => {
        if (btn.innerText.toLowerCase().includes(query)) {
            btn.style.display = 'block'; 
        } else {
            btn.style.display = 'none';
        }
    });
}
// =======================================

function processTree(id, isRightTree = true) {
    if (isRightTree) {
        rightTreeId = id;
        profiles[currentProfile].targetId = id;
        saveProfiles();
    }
    
    itemCounts = {};
    let qty = parseInt(document.getElementById('mnojitel').value) || 1;
    let invCopy = { ...profiles[currentProfile].inventory };

    function recurse(nodeId, count) {
        if (!nodeId) return;
        
        // Cek deduksi inventaris
        if (invCopy[nodeId] && invCopy[nodeId] >= count) {
            invCopy[nodeId] -= count;
            return;
        } else if (invCopy[nodeId] && invCopy[nodeId] > 0) {
            count -= invCopy[nodeId];
            invCopy[nodeId] = 0;
        }

        itemCounts[nodeId] = (itemCounts[nodeId] || 0) + count;

        if (TOME_DB[nodeId] && nodeId > 200) {
            recurse(TOME_DB[nodeId][0], count);
            recurse(TOME_DB[nodeId][1], count);
            recurse(TOME_DB[nodeId][2], count);
        } else if (nodeId >= 101 && nodeId <= 109) {
            // Konversi manual Lvl 1 ke Item Mentah Dasar
            itemCounts[12] = (itemCounts[12] || 0) + (count * 3);
        }
    }

    recurse(rightTreeId, qty);
    renderTrees();
    updateCostAndProgress();
}

function renderTrees() {
    let rightHtml = '<ul><li>Target</li>';
    rightHtml += `<li><button data-id="${rightTreeId}" onmouseover="showTooltip(this,event)" onmouseout="hideTooltip()">${Math.floor(rightTreeId/100)}</button> <b>${TOME_DB[rightTreeId][4]}</b></li></ul>`;
    document.getElementById('rightTree').innerHTML = rightHtml;

    let leftHtml = '<ul><li>Bahan</li>';
    let empty = true;
    for (let id in itemCounts) {
        if (itemCounts[id] > 0 && (id < 100 || id >= 101 && id <= 109 || !TOME_DB[id])) {
            let name = RAW_MATS[id] || TOME_DB[id][4];
            leftHtml += `<li><button data-id="${id}" onmouseover="showTooltip(this,event)" onmouseout="hideTooltip()">${id < 20 ? 'M' : Math.floor(id/100)}</button> <b>${name} (x${itemCounts[id]})</b></li>`;
            empty = false;
        }
    }
    if(empty) leftHtml += `<li>Semua bahan sudah terpenuhi di Inventory!</li>`;
    leftHtml += '</ul>';
    document.getElementById('leftTree').innerHTML = leftHtml;
}

function updateCostAndProgress() {
    let p12 = parseInt(document.getElementById('price12').value) || 0;
    let p11 = parseInt(document.getElementById('price11').value) || 0;
    let p10 = parseInt(document.getElementById('price10').value) || 0;

    let totalCost = 0;
    if (itemCounts[12]) totalCost += itemCounts[12] * p12;
    if (itemCounts[11]) totalCost += itemCounts[11] * p11;
    if (itemCounts[10]) totalCost += itemCounts[10] * p10;

    document.getElementById('totalCostDisplay').innerText = totalCost.toLocaleString('id-ID') + " Gold";

    let inv = profiles[currentProfile].inventory;
    let totalOwned = 0, totalNeeded = 0;
    for (let id in itemCounts) { totalNeeded += itemCounts[id]; }
    for (let id in inv) { if(inv[id] > 0) totalOwned += inv[id]; }
    
    let pct = totalNeeded === 0 ? 100 : Math.min(100, Math.round((totalOwned / (totalOwned + totalNeeded)) * 100));
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercentText').innerText = pct + '%';
    
    if (pct === 100 && totalNeeded === 0) {
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
    }
}

// MANAGEMENT INVENTARIS
function renderDeductions() {
    let html = '<ul><li>Isi Tas</li>';
    let inv = profiles[currentProfile].inventory;
    let empty = true;
    for (let id in inv) {
        if (inv[id] > 0) {
            let name = RAW_MATS[id] || TOME_DB[id][4];
            html += `<li><button data-id="${id}" onmouseover="showTooltip(this,event)" onmouseout="hideTooltip()">${id < 20 ? 'M' : Math.floor(id/100)}</button> <b>${name} (x${inv[id]})</b> <span onclick="modifyInventory(${id}, -1)"></span></li>`;
            empty = false;
        }
    }
    if (empty) html += `<li>Inventory Kosong.</li>`;
    html += '</ul>';
    document.getElementById('deductionsList').innerHTML = html;
}

function openInventoryModal() {
    document.getElementById('inventoryModal').style.display = 'flex';
    let div = document.getElementById('invItemList');
    let html = '';
    
    for (let id in RAW_MATS) {
        html += `<button class="btn-success" style="padding:6px; text-align:left;" onclick="modifyInventory(${id}, 1)">+1 ${RAW_MATS[id]}</button>`;
    }
    TOME_DB.forEach((item, id) => {
        html += `<button class="btn-secondary" style="padding:6px; text-align:left;" onclick="modifyInventory(${id}, 1)">+1 ${item[4]} (Lvl ${Math.floor(id/100)})</button>`;
    });
    div.innerHTML = html;
}

function closeInventoryModal() { 
    document.getElementById('inventoryModal').style.display = 'none'; 
    document.getElementById('invSearch').value = ''; 
    filterInventorySearch(''); // Reset pencarian saat ditutup
}

function modifyInventory(id, amount) {
    let inv = profiles[currentProfile].inventory;
    inv[id] = (inv[id] || 0) + amount;
    if (inv[id] <= 0) delete inv[id];
    saveProfiles();
    renderDeductions();
    processTree(rightTreeId, false);
}

// PROFILES ENGINE
function initProfiles() {
    let select = document.getElementById('profileSelect');
    select.innerHTML = '';
    for (let name in profiles) {
        let opt = document.createElement('option');
        opt.value = name; opt.innerText = name;
        if (name === currentProfile) opt.selected = true;
        select.appendChild(opt);
    }
}

function handleProfileChange(val) {
    currentProfile = val;
    localStorage.setItem('tomeCurrentProfile', val);
    rightTreeId = profiles[val].targetId || 616;
    processTree(rightTreeId, true);
    renderDeductions();
}

function createNewProfile() {
    let name = prompt("Masukkan nama profil baru:");
    if (name && !profiles[name]) {
        profiles[name] = { targetId: 616, inventory: {} };
        currentProfile = name;
        saveProfiles();
        initProfiles();
        handleProfileChange(name);
    }
}

function removeCurrentProfile() {
    if (currentProfile === 'Default') return alert("Profil default tidak bisa dihapus!");
    if (confirm(`Hapus profil "${currentProfile}"?`)) {
        delete profiles[currentProfile];
        currentProfile = 'Default';
        saveProfiles();
        initProfiles();
        handleProfileChange('Default');
    }
}

function saveProfiles() { localStorage.setItem('tomeProfiles', JSON.stringify(profiles)); }

// EXPORT & UTILITAS
function copyShareLink() {
    let state = { targetId: rightTreeId, inv: profiles[currentProfile].inventory };
    let base64 = btoa(JSON.stringify(state));
    let url = window.location.origin + window.location.pathname + '?build=' + base64;
    navigator.clipboard.writeText(url);
    alert(LANG[currentLang]['alertCopy']);
}

function loadSharedLink() {
    let urlParams = new URLSearchParams(window.location.search);
    let buildData = urlParams.get('build');
    if (buildData) {
        try {
            let decoded = JSON.parse(atob(buildData));
            profiles['Shared Build'] = { targetId: decoded.targetId, inventory: decoded.inv || {} };
            currentProfile = 'Shared Build';
            rightTreeId = decoded.targetId;
            initProfiles();
            handleProfileChange('Shared Build');
        } catch(e) { console.error("Gagal load link build."); }
    }
}

function exportToImage() {
    html2canvas(document.getElementById('captureArea')).then(canvas => {
        let link = document.createElement('a');
        link.download = `Tome_Build_${currentProfile}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
}

function resetCalculator() {
    if (confirm("Reset ulang semua data dan profil?")) {
        localStorage.clear();
        location.reload();
    }
}

window.onload = () => {
    initProfiles();
    loadSharedLink();
    applyLanguage();
};
</script>

</body>
</html>
