function nazv(t){
	var iii = t.title*1;
	var txt = '<a href="http://www.pwdatabase.com/pwi/items/'+i[iii][3]+'" target="_blank">'+i[iii][4]+'</a>';
	nazvDiv.innerHTML = txt;
}
function shelk(t){
	mnojInput.value = t.value*1;
	drevo(t.title*1,true);
}
function zachest(e,sw){
	if(!sw) vychet[e] = 0;
	drevo(derevo);
	if(e == vetka) mnojInput.value = schet[e];
	drevo(vetka,true);
	vychtennoe();
	scryt.visibility = 'visible';
}
function okno(e,t){
	var butt = t.parentNode.getElementsByTagName('button')[0].value;
	var uje = prompt('How much?',butt)*1;
	if(uje){
		if(!vychet[e]) vychet[e]=0;
		vychet[e] += uje;
		zachest(e,true);
	}
}
function vychtennoe_html(e){
	var deystv ='onClick="shelk(this)"';
	if(e==12 || e==11 || e==10) deystv = '';
	return '<li><span onClick="zachest('+e+');">Back</span><button style="'+sdvig(e)+'" value="'+vychet[e]+'" title="'+e+'" '+deystv+' onMouseOver="nazv(this);"></button><b>×'+vychet[e]+'</b></li>';
}
function vychtennoe(){
	var txt = '';
	var lis = '';
	if(vychet[11]) lis +=vychtennoe_html(11);
	if(vychet[12]) lis +=vychtennoe_html(12);
	if(vychet[10]) lis +=vychtennoe_html(10);
	if(lis!='') txt += '<ul><li>&nbsp;</li> '+lis+'</ul>';
	for(var r=1; r<=6; r++){
		lis = '';
		var nach = r*100+1;
		var konec = r*100+16;
		for(var e = nach; e<=konec; e++){
			if(vychet[e]){
				lis += vychtennoe_html(e);
			}
		}
		if(lis!='') txt += '<ul><li>'+r+'</li> '+lis+'</ul>';
	}
	vychetDiv.innerHTML = txt;
}

function okno_vybora(){
	var txt = '';
	for(var r=6; r>=1; r--){
		var lis = '';
		var nach = r*100+1;
		var konec = r*100+16;
		for(var e = nach; e<=konec; e++){
			if(i[e]){
				lis +='<li><button style="'+sdvig(e)+'" title="'+e+'" onClick="drevo(this.title)" onMouseOver="nazv(this);"></button></li>';
			}
		}
		txt += '<h4>'+r+'</h4><ul> '+lis+'</ul>';
	}
	vyborDiv.innerHTML = txt;
}
okno_vybora();

// INI FUNGSI YANG SUDAH DIPERBAIKI MATEMATIKANYA AGAR IKON TIDAK BERANTAKAN
function sdvig(iii){
	iii = parseInt(iii);
	switch(iii){
		case 10:
			return(' background-position:32px -32px');
		break;
		case 11:
			return(' background-position:64px 0px');
		break;
		case 12:
			return(' background-position:32px 0px');
		break;
	}
	var ryad = Math.floor(iii/100); 
	var num = iii - (ryad*100);
	return(' background-position:-'+(32*(num-1))+'px -'+(32*(ryad-1))+'px');
}

function w_html(e){
	var deystv ='onClick="shelk(this)"';
	if(e==12 || e==11 || e==10) deystv = '';
	return '<li><span onClick="okno('+e+',this);" title="Subtract the parts of the treatise already in existence"> </span><button style="'+sdvig(e)+'" value="'+schet[e]+'" title="'+e+'" '+deystv+' onMouseOver="nazv(this);"></button><b>×'+schet[e]+'</b></li>';
}

function w(){
	var txt = '';
	for(var r=6; r>=1; r--){
		var nach = r*100+1;
		var konec = r*100+16;
		txt += '<ul><li>'+r+'</li> ';
		for(var e = nach; e<=konec; e++){
			if(schet[e]){
				txt +=w_html(e);
			}
		}
		txt += '</ul>';		
	}
	
	txt += '<ul id="niz"><li>&nbsp;</li> ';
	if(schet[11]) txt +=w_html(11);
	txt += '<li>&nbsp;</li>';
	if(schet[12]) txt +=w_html(12);
	
	if(schet[10]) txt +='<li id="strelki">→ →</li>'+w_html(10);
	txt += '</ul>';
	
	document.getElementById(rawr?'rawrRawr':'rawr').innerHTML = txt;
}
function reDrevo(e){
	if(!schet[e])schet[e]=0;
	if(vychetCopy[e] && vychetCopy[e]>0)vychetCopy[e]--;
	else {
		schet[e]++;
		if(e>200){ reDrevo(i[e][0]); reDrevo(i[e][1]); reDrevo(i[e][2]); }
	}
}

function drevo(e,k){
	rawr=k;
	mnoj = 1;
	schet = [];
	str='';
	vychetCopy = vychet.slice();
	if(rawr){
		vetka = e;
		mnoj = mnojInput.value*1;
		if(vychet[e])mnoj +=vychet[e];
	} else derevo = e;
	
	for(var z=1; z<=mnoj; z++) reDrevo(e);
	
	var znach = 0;
	for(var z=101; z<=109; z++) if(schet[z]) znach += schet[z]*3;
	
	for(var z=12; z>=10; z--){
		switch(z){
			case 10: schet[10] = schet[12]*80;
				break;
			default: schet[z] = znach;
				break;
		}
		if(vychet[z]) schet[z]-= vychet[z]*1;
		if(schet[z]<0) schet[z] = 0;
	}
		
	w();
}
