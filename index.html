<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tome Crafting Analyzer & Financial Optimizer - v2.0.0</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --success-color: #198754;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --dark-color: #212529;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: var(--dark-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .section {
            background: var(--light-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }

        .section-title {
            margin-top: 0;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 5px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 11px;
            background: #e2e3e5;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: normal;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0b5ed7;
        }

        /* MASTER UI CONSTRAINT: MODAL ARCHITECTURE (LOCKED) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2001; /* Z-Index Locked */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 550px;
            max-height: 85vh; /* Responsive Constraint Locked */
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); }
            to { transform: translateY(0); }
        }

        .modal-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto; /* Scroll Locked */
            flex: 1;
        }

        .modal-footer {
            padding: 12px 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background-color: #6c757d;
            padding: 8px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-shortcut {
            background-color: var(--success-color);
            padding: 8px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Progress Bar Core Custom Visual */
        .progress-wrapper {
            margin: 15px 0;
        }
        .progress-bar-container {
            background-color: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            height: 20px;
            width: 100%;
        }
        .progress-bar-fill {
            background-color: var(--success-color);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Tome Crafting Analyzer & Financial Dashboard</h1>
    
    <div class="section">
        <div class="section-title">
            <span>📦 Data Inventory Aktual</span>
            <span class="status-badge" style="background:#d1e7dd; color:#0f5132;">💾 Autosave Aktif</span>
        </div>
        <div class="grid-3">
            <div class="form-group">
                <label for="invPages">Tome Page</label>
                <input type="number" id="invPages" value="12" min="0" oninput="StorageModule.saveToLocal()">
            </div>
            <div class="form-group">
                <label for="invFragments">Tome Fragment</label>
                <input type="number" id="invFragments" value="8" min="0" oninput="StorageModule.saveToLocal()">
            </div>
            <div class="form-group">
                <label for="invTokens">Token of Luck</label>
                <input type="number" id="invTokens" value="150" min="0" oninput="StorageModule.saveToLocal()">
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">💰 Harga Pasar Aktual (Market Price)</div>
        <div class="grid-2">
            <div class="form-group">
                <label for="pricePage">Harga 1x Tome Page (Gold/Zeny)</label>
                <input type="number" id="pricePage" value="500" min="0" oninput="StorageModule.saveToLocal()">
            </div>
            <div class="form-group">
                <label for="priceFragment">Harga 1x Tome Fragment (Gold/Zeny)</label>
                <input type="number" id="priceFragment" value="150" min="0" oninput="StorageModule.saveToLocal()">
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🎯 Pilih Target Kombinasi Tome</div>
        <div class="form-group">
            <label for="targetTome">Buku Target Rekursif</label>
            <select id="targetTome" onchange="StorageModule.saveToLocal()"></select>
        </div>
    </div>

    <button class="btn" onclick="runReverseCalculator()">Jalankan Analisis Komprehensif</button>
</div>

<div class="modal-overlay" id="reverseCalcModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Hasil Analisis Reverse Calculator</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="analysisSummary"></div>
            <div id="smartFarmingContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">Tutup</button>
            <button class="btn-shortcut" onclick="selectTargetBook()">Jadikan Target Utama</button>
        </div>
    </div>
</div>

<script>
/**
 * ====================================================================
 * DATA STRUKTUR: CORE SIMULASI DATABASE TOME (ID 101 - 616)
 * ====================================================================
 */
const TOME_DB = {
    101: { name: "Novice Sage Chronicle (Lvl 1)", level: 1, reqPages: 4, reqFragments: 3 },
    202: { name: "Apprentice Spellbook (Lvl 2)", level: 2, childs: [101, 101, 101] },
    305: { name: "Adept Sorcery Codex (Lvl 3)", level: 3, childs: [202, 202, 202] },
    410: { name: "Master Arcanum Tome (Lvl 4)", level: 4, childs: [305, 305, 305] },
    512: { name: "Grandmaster Grimoire (Lvl 5)", level: 5, childs: [410, 410, 410] },
    616: { name: "Archmage Ancient Grimoire (Lvl 6)", level: 6, childs: [512, 512, 512] }
};

// Inisialisasi Opsi Dropdown Data Target
const selectEl = document.getElementById('targetTome');
for (const [id, book] of Object.entries(TOME_DB)) {
    let opt = document.createElement('option');
    opt.value = id;
    opt.innerText = `[ID ${id}] ${book.name}`;
    selectEl.appendChild(opt);
}

/**
 * ====================================================================
 * RUTE 1: MODUL LOCAL STORAGE (DATA PERSISTENCE)
 * ====================================================================
 */
const StorageModule = {
    KEY: 'TomeAnalyzer_MasterData',
    
    saveToLocal() {
        const data = {
            pages: document.getElementById('invPages').value,
            fragments: document.getElementById('invFragments').value,
            tokens: document.getElementById('invTokens').value,
            pricePage: document.getElementById('pricePage').value,
            priceFragment: document.getElementById('priceFragment').value,
            targetTome: document.getElementById('targetTome').value
        };
        localStorage.setItem(this.KEY, JSON.stringify(data));
    },

    loadFromLocal() {
        const savedData = localStorage.getItem(this.KEY);
        if (!savedData) return;
        
        try {
            const data = JSON.parse(savedData);
            if(data.pages !== undefined) document.getElementById('invPages').value = data.pages;
            if(data.fragments !== undefined) document.getElementById('invFragments').value = data.fragments;
            if(data.tokens !== undefined) document.getElementById('invTokens').value = data.tokens;
            if(data.pricePage !== undefined) document.getElementById('pricePage').value = data.pricePage;
            if(data.priceFragment !== undefined) document.getElementById('priceFragment').value = data.priceFragment;
            if(data.targetTome !== undefined) document.getElementById('targetTome').value = data.targetTome;
        } catch (e) {
            console.error("Gagal memuat data dari LocalStorage", e);
        }
    }
};

// Jalankan auto-load saat pertama kali halaman terbuka
window.onload = () => {
    StorageModule.loadFromLocal();
};

/**
 * ====================================================================
 * CORE ENGINE KALKULATOR: RECURSIVE DEEP COPY LOGIC (LOCKED)
 * ====================================================================
 */
function testCraft(tomeId, pool) {
    const book = TOME_DB[tomeId];
    if (!book) return { progress: 0, required: { pages: 0, fragments: 0 } };

    if (book.level === 1) {
        const totalElements = 7; 
        let matchedElements = 0;

        if (pool.pages >= book.reqPages) {
            matchedElements += 4;
            pool.pages -= book.reqPages;
        } else {
            matchedElements += (pool.pages / book.reqPages) * 4;
            pool.pages = 0;
        }

        if (pool.fragments >= book.reqFragments) {
            matchedElements += 3;
            pool.fragments -= book.reqFragments;
        } else {
            matchedElements += (pool.fragments / book.reqFragments) * 3;
            pool.fragments = 0;
        }

        const percentage = (matchedElements / totalElements) * 100;
        return {
            progress: percentage,
            required: { pages: book.reqPages, fragments: book.reqFragments }
        };
    }

    if (book.childs && book.childs.length === 3) {
        let totalProgressAccumulated = 0;
        let aggregateRequirements = { pages: 0, fragments: 0 };

        book.childs.forEach(childId => {
            const childResult = testCraft(childId, pool);
            totalProgressAccumulated += childResult.progress / 3;
            aggregateRequirements.pages += childResult.required.pages;
            aggregateRequirements.fragments += childResult.required.fragments;
        });

        return {
            progress: totalProgressAccumulated,
            required: aggregateRequirements
        };
    }

    return { progress: 0, required: { pages: 0, fragments: 0 } };
}

/**
 * ====================================================================
 * CONTROLLER: RUN PROCESS
 * ====================================================================
 */
let globalCurrentTargetId = null;

function runReverseCalculator() {
    const currentInventory = {
        pages: parseInt(document.getElementById('invPages').value) || 0,
        fragments: parseInt(document.getElementById('invFragments').value) || 0,
        tokens: parseInt(document.getElementById('invTokens').value) || 0
    };

    const marketPrices = {
        pagePrice: parseInt(document.getElementById('pricePage').value) || 0,
        fragmentPrice: parseInt(document.getElementById('priceFragment').value) || 0
    };

    const targetId = document.getElementById('targetTome').value;
    globalCurrentTargetId = targetId;

    const simulationPool = { ...currentInventory };
    const analysis = testCraft(targetId, simulationPool);
    const targetBookData = TOME_DB[targetId];

    const summaryUI = document.getElementById('analysisSummary');
    summaryUI.innerHTML = `
        <p style="margin:0 0 10px 0;">Analisis Kelayakan Pembuatan:</p>
        <strong style="font-size:16px; color:#000;">${targetBookData.name}</strong>
        <div class="progress-wrapper">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                <span>Kelengkapan Material Simulasi</span>
                <strong>${analysis.progress.toFixed(2)}%</strong>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: ${Math.min(100, analysis.progress)}%"></div>
            </div>
        </div>
        <div style="font-size:13px; color:#555; background:#f1f3f5; padding:10px; border-radius:6px; margin-bottom:15px;">
            Total Kebutuhan Bahan Mutlak:<br>
            • Tome Page: <strong>${analysis.required.pages}</strong> unit<br>
            • Tome Fragment: <strong>${analysis.required.fragments}</strong> unit
        </div>
    `;

    // Eksekusi Modul Finansial & Smart Farming secara bersamaan
    SmartFarmingModule.init(analysis.required, currentInventory, marketPrices);

    document.getElementById('reverseCalcModal').classList.add('active');
}

function closeModal() {
    document.getElementById('reverseCalcModal').classList.remove('remove');
    document.getElementById('reverseCalcModal').classList.remove('active');
}

function selectTargetBook() {
    if(globalCurrentTargetId) {
        alert(`Sukses mengunci Target Utama ke ID Buku: ${globalCurrentTargetId}. Seluruh sistem latar belakang diperbarui!`);
        closeModal();
    }
}

/**
 * ====================================================================
 * RUTE 2: EXTENSION MODULE - SMART FARMING & FINANCIAL VALUATION (v2.0.0)
 * ====================================================================
 */
const SmartFarmingModule = {
    CONFIG: {
        TOKEN_COST_PER_PAGE: 20
    },

    calculateDeficiency(target, inventory, marketPrices) {
        const missingPages = Math.max(0, target.pages - inventory.pages);
        const missingFragments = Math.max(0, target.fragments - inventory.fragments);
        
        let remainingTokens = inventory.tokens || 0;
        let finalMissingPages = missingPages;
        const recommendations = [];
        const shoppingList = [];

        // 1. Optimasi Token of Luck (Menghemat pengeluaran Gold pemain)
        if (missingPages > 0 && remainingTokens > 0) {
            const affordablePages = Math.floor(remainingTokens / this.CONFIG.TOKEN_COST_PER_PAGE);
            
            if (affordablePages > 0) {
                const pagesToCraft = Math.min(affordablePages, missingPages);
                const tokensUsed = pagesToCraft * this.CONFIG.TOKEN_COST_PER_PAGE;
                
                finalMissingPages -= pagesToCraft;
                remainingTokens -= tokensUsed;
                
                recommendations.push(`Gunakan <strong>${tokensUsed} Token of Luck</strong> untuk mencetak <strong>${pagesToCraft} Tome Page</strong>.`);
            }
        }

        // 2. Pemetaan Daftar Belanja Pasar
        if (finalMissingPages > 0) shoppingList.push({ name: 'Tome Page', qty: finalMissingPages });
        if (missingFragments > 0) shoppingList.push({ name: 'Tome Fragment', qty: missingFragments });

        // 3. MATEMATIKA FINANSIAL: Hitung estimasi modal Gold yang dibutuhkan
        const costFromPages = finalMissingPages * marketPrices.pagePrice;
        const costFromFragments = missingFragments * marketPrices.fragmentPrice;
        const totalEstimatedGold = costFromPages + costFromFragments;

        return {
            isComplete: finalMissingPages === 0 && missingFragments === 0,
            shoppingList: shoppingList,
            recommendations: recommendations,
            totalGoldRequired: totalEstimatedGold
        };
    },

    renderUI(analysisResult) {
        const container = document.getElementById('smartFarmingContainer');
        if (!container) return;

        container.innerHTML = '';
        container.style.cssText = 'margin-top: 20px; padding: 15px; border-left: 4px solid #0d6efd; border-radius: 6px; background-color: #f8f9fa;';

        // Kasus A: Bahan Baku Sempurna Mencukupi
        if (analysisResult.isComplete) {
            container.style.borderLeftColor = '#198754';
            container.innerHTML = `
                <h4 style="margin: 0 0 5px 0; font-size: 14px; color: #198754; font-weight: bold;">✅ Status: Siap Crafting</h4>
                <p style="margin: 0; font-size: 13px; color: #555;">Semua material di inventory Anda mencukupi untuk target ini.</p>
                ${analysisResult.recommendations.length > 0 ? `<div style="margin-top: 10px; font-size: 13px; color: #212529; background: #e8f5e9; padding: 8px; border-radius:4px;"><strong>Saran Aksi:</strong><br>💡 ${analysisResult.recommendations.join('<br>💡 ')}</div>` : ''}
            `;
            return;
        }

        // Kasus B: Bahan Kurang (Tampilkan Rute Belanja + Estimasi Harga Pasar)
        container.style.borderLeftColor = '#0d6efd';
        let shoppingItemsHTML = analysisResult.shoppingList.map(item => `<li style="margin-bottom: 4px;">Beli di Market: <strong>${item.qty}x ${item.name}</strong></li>`).join('');
        let recItemsHTML = analysisResult.recommendations.map(rec => `<li style="margin-bottom: 4px;">💡 ${rec}</li>`).join('');

        // Format angka mata uang agar mudah dibaca (e.g. 15.000)
        const formattedGold = new Intl.NumberFormat('id-ID').format(analysisResult.totalGoldRequired);

        container.innerHTML = `
            <h4 style="margin: 0 0 10px 0; font-size: 14px; color: #333; font-weight: bold;">🛒 Analisis Kekurangan & Rekomendasi</h4>
            <ul style="margin: 0 0 10px 0; padding-left: 20px; font-size: 13px; color: #dc3545; font-weight: 500;">
                ${shoppingItemsHTML}
            </ul>
            
            <div style="margin: 12px 0; padding: 10px; background-color: #fff3cd; border: 1px solid #ffe69c; color: #664d03; border-radius: 6px; font-size: 13px;">
                💰 Estimasi Dana Tambahan: <strong>${formattedGold} Gold/Zeny</strong>
            </div>

            ${analysisResult.recommendations.length > 0 ? `
                <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ccc;">
                <ul style="margin: 0; padding-left: 0; font-size: 13px; color: #198754; list-style-type: none;">
                    ${recItemsHTML}
                </ul>
            ` : ''}
        `;
    },

    init(targetRequirements, currentInventory, marketPrices) {
        const result = this.calculateDeficiency(targetRequirements, currentInventory, marketPrices);
        this.renderUI(result);
    }
};
</script>

</body>
</html>
