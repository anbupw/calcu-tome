<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Tome Pro & Pembuat Build</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--bg-main);
            padding: 16px;
            border-radius: 12px;
        }

        /* Top Header Control Banner */
        .control-banner {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-danger { background-color: var(--accent-red); }
        .btn-success { background-color: var(--accent-green); }
        .btn-secondary { background-color: var(--bg-input); border: 1px solid var(--border-color); }

        select, input[type="number"], input[type="text"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        /* Workspace Grid Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #nazvaniye {
            font-size: 15px;
            color: var(--accent-blue);
            min-height: 24px;
            font-weight: 500;
        }
        #nazvaniye a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        #nazvaniye a:hover {
            text-decoration: underline;
        }

        /* Tree List Formatting styles */
        .branch ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .branch ul li:first-child {
            font-weight: 600;
            color: var(--text-muted);
            min-width: 80px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .branch ul li {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .branch button {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 4px;
            background-color: #111;
            border: 1px solid #555;
            cursor: pointer;
            position: relative;
        }

        .branch b {
            font-size: 13px;
        }

        /* Remove Action Trigger */
        .branch ul li span {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: var(--accent-red);
            color: white;
            width: 14px;
            height: 14px;
            font-size: 10px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            line-height: 1;
        }
        .branch ul li span::before {
            content: '×';
        }
        #deductionsList ul li:hover span {
            display: flex;
        }

        /* Progress Bar */
        .progress-container {
            background-color: var(--bg-input);
            border-radius: 20px;
            height: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text-wrapper {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }

        /* Floating Custom Tooltip Element */
        #floatingTooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-blue);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            z-index: 9999;
            pointer-events: none;
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            min-width: 220px;
            max-width: 300px;
        }

        .tooltip-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .tooltip-type {
            font-size: 11px;
            color: var(--accent-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .tooltip-stat {
            display: block;
            color: var(--accent-green);
            margin-bottom: 2px;
        }

        .tooltip-footer {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 4px;
        }

        /* Modal Structure Design */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Hidden standard selection block */
        #vyborDiv {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }
        #vyborDiv h4 {
            margin: 8px 0 4px 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        #bookSearch {
            margin-bottom: 10px;
            width: 100%;
            display: none;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>

<div class="container">
    
    <div class="control-banner">
        <select id="profileSelect" onchange="handleProfileChange(this.value)"></select>
        <button class="btn-secondary" onclick="createNewProfile()">➕ Profil</button>
        <button class="btn-danger" style="padding: 8px 12px;" onclick="removeCurrentProfile()">🗑️</button>
        
        <button id="langBtn" class="btn-secondary" onclick="toggleLanguage()">🌐 Language</button>
        <button id="menuToggleBtn" class="btn-secondary" onclick="toggleBookPanel()">⚙️ Menu</button>
        <button class="btn-success" onclick="openInventoryModal()">📥 Add to Inventory</button>
        
        <button class="btn-secondary" onclick="exportProfilesData()">📤 Backup JSON</button>
        <input type="file" id="importFile" style="display:none;" onchange="importProfilesData(event)">
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📥 Restore JSON</button>
        
        <button class="btn-danger" style="margin-left: auto;" data-i18n="btnReset" onclick="resetCalculator()">🔄 Reset</button>
    </div>

    <input type="text" id="bookSearch" placeholder="🔍 Cari..." oninput="filterBooks(this.value)">
    <div id="vyborDiv"></div>

    <div class="workspace">
        
        <div class="card">
            <div class="card-title">
                <span data-i18n="title2">Cabang Terpilih</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size:14px; font-weight:normal;">Qty:</span>
                    <input type="number" id="mnojitel" value="1" min="1" max="99" style="width: 60px; padding: 4px 8px;" oninput="processTree(rightTreeId, true)">
                </div>
            </div>
            <div id="nazvaniye" data-i18n="desc1">Arahkan kursor ke ikon untuk melihat nama buku.</div>
            <div id="rightTree" class="branch"></div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="title1">Kebutuhan Total</div>
            <div id="leftTree" class="branch"></div>
            
            <div class="card-title" data-i18n="title3">Estimasi Biaya Pasar</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Tome Page</label>
                    <input type="number" id="price12" value="0" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Tome Fragment</label>
                    <input type="number" id="price11" value="0" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
                <div>
                    <label style="font-size:11px; color:var(--text-muted);">Token of Luck</label>
                    <input type="number" id="price10" value="0" style="width:100%;" oninput="updateCostAndProgress()">
                </div>
            </div>
            <div class="cost-row">
                <span style="font-weight:600;" data-i18n="totalCostLabel">Total Sisa Biaya:</span>
                <span id="totalCostDisplay" style="color:var(--accent-green); font-weight:700; font-size:18px;">0 Gold</span>
            </div>

            <div class="progress-text-wrapper">
                <span data-i18n="progText">Progres Pengumpulan:</span>
                <span id="progressPercentText">0%</span>
            </div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

    </div>

    <div class="card" style="margin-top:20px;">
        <div class="card-title" data-i18n="title4">📦 Inventory (Bahan Dimiliki)</div>
        <div id="deductionsList" class="branch"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-secondary" data-i18n="btnShare" onclick="copyShareLink()">🔗 Bagikan Build (Copy)</button>
            <button class="btn-secondary" data-i18n="btnExport" onclick="exportToImage(event)">📸 Download Gambar Build</button>
        </div>
    </div>

    <div class="footer" data-i18n="footerText">Kalkulator Tome © 2026</div>

</div>

<div id="floatingTooltip"></div>

<div id="customModal" class="modal-overlay" onclick="if(event.target===this) closeModal();">
    <div class="modal-content">
        <h3 id="modalTitle">Tambah Item</h3>
        <p style="font-size:13px; color:var(--text-muted);" data-i18n="modalDesc">Berapa banyak item ini yang sudah Anda miliki?</p>
        <input type="number" id="modalInput" value="1" min="1">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn-secondary" data-i18n="btnCancel" onclick="closeModal()">Batal</button>
            <button class="btn-success" data-i18n="btnSave" onclick="confirmModal()">Simpan</button>
        </div>
    </div>
</div>

<div id="inventoryModal" class="modal-overlay" onclick="if(event.target===this) closeInventoryModal();">
    <div class="modal-content" style="max-width: 500px;">
        <h3 data-i18n="modalTitleAdd">Tambah Buku/Bahan</h3>
        <input type="text" id="invSearch" placeholder="Cari nama buku..." oninput="filterInventorySearch(this.value)">
        <div id="invItemList" style="max-height:300px; overflow-y:auto; padding:10px 0;"></div>
        <button class="btn-secondary" data-i18n="btnCancel" onclick="closeInventoryModal()">Tutup</button>
    </div>
</div>

let currentLang = localStorage.getItem('tomeLang') || 'id';

function applyLanguage() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (LANG[currentLang][key]) {
            if (el.tagName === 'INPUT') el.placeholder = LANG[currentLang][key];
            else el.innerHTML = LANG[currentLang][key]; 
        }
    });
    
    document.getElementById('langBtn').innerText = currentLang === 'id' ? '🌐 Switch to English' : '🌐 Ganti ke Indonesia';
    document.getElementById('menuToggleBtn').innerText = LANG[currentLang]['menuBtnText'];
    
    processTree(leftTreeId, false);
    processTree(rightTreeId, true);
    renderDeductions();
    renderMenu();
}

function toggleLanguage() {
    currentLang = currentLang === 'id' ? 'en' : 'id';
    localStorage.setItem('tomeLang', currentLang);
    applyLanguage();
}

// MOUSE OVER FLOATING TOOLTIP SYNC MANAGEMENT
function showTooltip(element, event) {
    const id = parseInt(element.getAttribute('data-id'));
    if (!TOME_DB[id] && id !== 10 && id !== 11 && id !== 12) return;
    
    const tooltip = document.getElementById('floatingTooltip');
    let nameText = "";
    let typeText = LANG[currentLang]['matDesc'];
    let statsHtml = "";
    
    if (id === 10) { 
        nameText = "Token of Luck"; 
        typeText = currentLang === 'id' ? "Mata Uang Kegiatan" : "Event Currency";
    } else if (id === 11) { 
        nameText = "Tome Fragment"; 
    } else if (id === 12) { 
        nameText = "Tome Page"; 
    } else { 
        nameText = TOME_DB[id][4]; 
        const lvl = Math.floor(id / 100);
        typeText = `Tome (${LANG[currentLang]['lvl']} ${lvl})`;
        
        if (TOME_STATS[id]) {
            TOME_STATS[id].forEach(stat => {
                statsHtml += `<span class="tooltip-stat">• ${stat}</span>`;
            });
        }
    }

    let html = `
        <div class="tooltip-title">
            <span style="display:inline-block; width:32px; height:32px; background-image:url('znachki.png'); ${getSpritePosition(id)}; transform: scale(0.8); pointer-events:none;"></span>
            ${nameText}
        </div>
        <div class="tooltip-type">${typeText}</div>
        <div class="tooltip-list">${statsHtml}</div>
        <div class="tooltip-footer">${LANG[currentLang]['statEquipDesc']}</div>
    `;
    
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    moveTooltip(event);
    
    let linkUrl = (id === 10) ? "http://www.pwdatabase.com/pwi/items/24722" :
                  (id === 11) ? "http://www.pwdatabase.com/pwi/items/17011" :
                  (id === 12) ? "http://www.pwdatabase.com/pwi/items/17010" :
                  `http://www.pwdatabase.com/pwi/items/${TOME_DB[id][3]}`;
    document.getElementById('nazvaniye').innerHTML = `<a href="${linkUrl}" target="_blank">► ${nameText}</a>`;
}

function moveTooltip(event) {
    const tooltip = document.getElementById('floatingTooltip');
    if (tooltip.style.display !== 'block') return;
    
    let x = event.clientX + 15;
    let y = event.clientY + 15;
    
    const tooltipWidth = tooltip.offsetWidth || 240;
    const tooltipHeight = tooltip.offsetHeight || 160;
    
    if (x + tooltipWidth > window.innerWidth) {
        x = event.clientX - tooltipWidth - 15;
    }
    if (y + tooltipHeight > window.innerHeight) {
        y = event.clientY - tooltipHeight - 15;
    }
    
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
}

function copyShareLink() {

    const hash = btoa(JSON.stringify(finalState));

    if (navigator.clipboard) {

function loadFromHash() {
    if (window.location.hash) {
        try {
            const state = JSON.parse(atob(window.location.hash.substring(1)));
            if (state.l) leftTreeId = state.l;
            if (state.r) rightTreeId = state.r;
            if (state.m) document.getElementById('mnojitel').value = state.m;
            if (state.d) {
                deductions = [];

                saveDeductions(); 
            }
            history.replaceState(null, null, ' ');

    }
}

function getSpritePosition(id) { 
    const parsedId = parseInt(id);
    if (parsedId === 10) return 'background-position:32px -32px';
    if (parsedId === 11) return 'background-position:64px 0px';
    if (parsedId === 12) return 'background-position:32px 0px';
    let row = Math.floor(parsedId / 100);
    let num = parsedId - (row * 100);
    return `background-position:-${32 * (num - 1)}px -${32 * (row - 1)}px`;
}

function updateCostAndProgress() {
    let price10 = parseInt(document.getElementById('price10').value) || 0;
    let price11 = parseInt(document.getElementById('price11').value) || 0;
    let price12 = parseInt(document.getElementById('price12').value) || 0;
    
    localStorage.setItem('tomePrice10', price10);
    localStorage.setItem('tomePrice11', price11);
    localStorage.setItem('tomePrice12', price12);
    
    saveActiveProfile(); 

    let netCounts = [];
    let dedCopy = [...deductions];
    let multiplier = parseInt(document.getElementById('mnojitel').value) || 1;
    if (multiplier < 1) multiplier = 1; if (multiplier > 99) multiplier = 99;

    function calcNetNode(nodeId) {
        if (!netCounts[nodeId]) netCounts[nodeId] = 0;
        if (dedCopy[nodeId] && dedCopy[nodeId] > 0) {
            dedCopy[nodeId]--;
        } else {
            netCounts[nodeId]++;
            if (nodeId > 200) { calcNetNode(TOME_DB[nodeId][0]); calcNetNode(TOME_DB[nodeId][1]); calcNetNode(TOME_DB[nodeId][2]); }
        }
    }

    for (let z = 0; z < multiplier; z++) calcNetNode(rightTreeId);

    let netBaseMats = 0;
    for (let z = 101; z <= 109; z++) if (netCounts[z]) netBaseMats += netCounts[z] * 3;
    
    netCounts[12] = netBaseMats; if (deductions[12]) netCounts[12] -= deductions[12]; if (netCounts[12] < 0) netCounts[12] = 0;
    netCounts[11] = netBaseMats; if (deductions[11]) netCounts[11] -= deductions[11]; if (netCounts[11] < 0) netCounts[11] = 0;
    netCounts[10] = netCounts[12] * 80; if (deductions[10]) netCounts[10] -= deductions[10]; if (netCounts[10] < 0) netCounts[10] = 0;

    let grossCounts = [];
    function calcGrossNode(nodeId) {
        if (!grossCounts[nodeId]) grossCounts[nodeId] = 0;
        grossCounts[nodeId]++;
        if (nodeId > 200) { calcGrossNode(TOME_DB[nodeId][0]); calcGrossNode(TOME_DB[nodeId][1]); calcGrossNode(TOME_DB[nodeId][2]); }
    }
    for (let z = 0; z < multiplier; z++) calcGrossNode(rightTreeId);
    
    let grossBaseMats = 0;
    for (let z = 101; z <= 109; z++) if (grossCounts[z]) grossBaseMats += grossCounts[z] * 3;
    grossCounts[11] = grossBaseMats; grossCounts[12] = grossBaseMats; grossCounts[10] = grossBaseMats * 80;

    let totalCost = (netCounts[10] || 0) * price10 + (netCounts[11] || 0) * price11 + (netCounts[12] || 0) * price12;
    document.getElementById('totalCostDisplay').innerText = totalCost.toLocaleString('id-ID') + " Gold";

    let grossVal = (grossCounts[10] || 0) + (grossCounts[12] || 0) * 80 + (grossCounts[11] || 0) * 80;
    let netVal = (netCounts[10] || 0) + (netCounts[12] || 0) * 80 + (netCounts[11] || 0) * 80;
    
    let pct = grossVal > 0 ? ((grossVal - netVal) / grossVal) * 100 : 0;
    if (pct < 0) pct = 0; if (pct > 100) pct = 100;

    document.getElementById('progressBar').style.width = pct.toFixed(1) + '%';
    document.getElementById('progressPercentText').innerText = pct.toFixed(1) + '%';

    if (pct === 100 && !window.confettiFired) {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#3b82f6', '#10b981', '#f59e0b'] });
        window.confettiFired = true; 
    } else if (pct < 100) window.confettiFired = false; 
}

function getTreeItemHtml(id, isDeductionList = false) {
    const count = isDeductionList ? deductions[id] : itemCounts[id];
    let actionSpan = isDeductionList ? `<span onClick="removeDeduction(${id});" title="Hapus dari daftar ini"></span>` : `<span onClick="addDeduction(${id});" title="Kurangi dari total"></span>`;
    let clickAction = isDeductionList ? '' : 'onClick="handleItemClick(this)"';
    if (!isDeductionList && (id === 12 || id === 11 || id === 10)) clickAction = '';
    return `<li>${actionSpan}<button style="${getSpritePosition(id)}" value="${count}" data-id="${id}" ${clickAction} onMouseOver="showTooltip(this, event);" onMouseMove="moveTooltip(event);" onMouseOut="hideTooltip();"></button><b>×${count}</b></li>`;
}

function renderTree(isRightTree) {
	let txt = '';
    const txtLvl = LANG[currentLang]['lvl'];
    const txtBase = LANG[currentLang]['baseMat'];

	for (let r = 6; r >= 1; r--) {
		let start = r * 100 + 1; let end = r * 100 + 16; let hasItem = false;
		let tempTxt = `<ul><li>${txtLvl} ${r}</li> `;
		for (let e = start; e <= end; e++) {
			if (itemCounts[e]) { tempTxt += getTreeItemHtml(e); hasItem = true; }
		}
		tempTxt += '</ul>';
		if (hasItem) txt += tempTxt;
	}
	
	txt += `<ul id="niz"><li>${txtBase}</li> `;
	if (itemCounts[11]) txt += getTreeItemHtml(11);
	if (itemCounts[12]) txt += getTreeItemHtml(12);
	if (itemCounts[10]) txt += `<li id="strelki" style="margin: 0 10px;">→</li>${getTreeItemHtml(10)}`;
	txt += `</ul>`;
	document.getElementById(isRightTree ? 'rightTree' : 'leftTree').innerHTML = txt;
}

function renderDeductions() {
    let txt = ''; let lis = ''; const deductionsDiv = document.getElementById('deductionsList');
    if (deductions[11]) lis += getTreeItemHtml(11, true); if (deductions[12]) lis += getTreeItemHtml(12, true); if (deductions[10]) lis += getTreeItemHtml(10, true);
    if (lis !== '') txt += `<ul><li>${LANG[currentLang]['baseMat']}</li> ${lis}</ul>`;
    for (let r = 1; r <= 6; r++) {
        lis = ''; let start = r * 100 + 1; let end = r * 100 + 16;
        for (let e = start; e <= end; e++) if (deductions[e]) lis += getTreeItemHtml(e, true);
        if (lis !== '') txt += `<ul><li>${LANG[currentLang]['lvl']} ${r}</li> ${lis}</ul>`;
    }
    deductionsDiv.innerHTML = txt;
}

function renderMenu() {
    let txt = '';
    for (let r = 6; r >= 1; r--) {
        let lis = ''; let start = r * 100 + 1; let end = r * 100 + 16;
        for (let e = start; e <= end; e++) if (TOME_DB[e]) lis += `<li><button style="${getSpritePosition(e)}" data-id="${e}" onClick="processTree(${e}, false)" onMouseOver="showTooltip(this, event);" onMouseMove="moveTooltip(event);" onMouseOut="hideTooltip();"></button></li>`;
        txt += `<h4>Tome ${LANG[currentLang]['lvl']} ${r}</h4><ul style="display: flex; flex-wrap: wrap; gap: 8px;"> ${lis}</ul>`;
    }
    document.getElementById('vyborDiv').innerHTML = txt;
}

function calculateNode(id) {
	if (!itemCounts[id]) itemCounts[id] = 0;
	if (deductionsCopy[id] && deductionsCopy[id] > 0) {
		deductionsCopy[id]--;
	} else {
		itemCounts[id]++;
		if (id > 200) { 
            calculateNode(TOME_DB[id][0]); 
            calculateNode(TOME_DB[id][1]); 
            calculateNode(TOME_DB[id][2]); 
        }
	}
}

function processTree(id, isRightTree = false) {
    itemCounts = [];
    deductionsCopy = [...deductions];
    let multiplier = 1;

    if (isRightTree) {
        rightTreeId = id;
        let inputField = document.getElementById('mnojitel');
        let inputVal = parseInt(inputField.value);
        if (isNaN(inputVal) || inputVal < 1) inputVal = 1;
        if (inputVal > 99) inputVal = 99;
        inputField.value = inputVal; 
        multiplier = inputVal;
    } else leftTreeId = id;

    for (let z = 0; z < multiplier; z++) calculateNode(id);

    let baseMats = 0;
    for (let z = 101; z <= 109; z++) if (itemCounts[z]) baseMats += itemCounts[z] * 3;

    for (let z = 12; z >= 10; z--) {
        itemCounts[z] = z === 10 ? (itemCounts[12] || 0) * 80 : baseMats;
        if (deductions[z]) itemCounts[z] -= deductions[z];
        if (itemCounts[z] < 0) itemCounts[z] = 0;
    }
        
    renderTree(isRightTree);
    updateCostAndProgress(); 
}

function initProfiles() {
    try {
        const saved = localStorage.getItem('tomeProfiles');
        if (saved) profiles = JSON.parse(saved);
    } catch (e) { profiles = {}; }
    
    if (!profiles['Default']) {
        profiles['Default'] = { l: 616, r: 515, m: 1, d: [], p10: 0, p11: 0, p12: 0 };
    }
    
    currentProfile = localStorage.getItem('tomeCurrentProfile') || 'Default';
    if (!profiles[currentProfile]) currentProfile = 'Default';
    
    loadProfileData(currentProfile);
    renderProfileDropdown();
}

function renderProfileDropdown() {
    const select = document.getElementById('profileSelect');
    if (!select) return;
    select.innerHTML = '';
    for (let name in profiles) {
        let opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        if (name === currentProfile) opt.selected = true;
        select.appendChild(opt);
    }
}

function loadProfileData(name) {
    currentProfile = name;
    localStorage.setItem('tomeCurrentProfile', name);
    
    const data = profiles[name];
    leftTreeId = data.l || 616;
    rightTreeId = data.r || 515;
    document.getElementById('mnojitel').value = data.m || 1;
    deductions = data.d || [];
    
    document.getElementById('price10').value = data.p10 || 0;
    document.getElementById('price11').value = data.p11 || 0;
    document.getElementById('price12').value = data.p12 || 0;
    
    localStorage.setItem('tomeDeductions', JSON.stringify(deductions));
    localStorage.setItem('tomePrice10', data.p10 || 0);
    localStorage.setItem('tomePrice11', data.p11 || 0);
    localStorage.setItem('tomePrice12', data.p12 || 0);
}

function handleProfileChange(name) {
    loadProfileData(name);
    applyLanguage();
}

function saveActiveProfile() {
    let p10 = parseInt(document.getElementById('price10').value) || 0;
    let p11 = parseInt(document.getElementById('price11').value) || 0;
    let p12 = parseInt(document.getElementById('price12').value) || 0;
    let m = parseInt(document.getElementById('mnojitel').value) || 1;

    profiles[currentProfile] = {
        l: leftTreeId,
        r: rightTreeId,
        m: m,
        d: deductions,
        p10: p10,
        p11: p11,
        p12: p12
    };
    localStorage.setItem('tomeProfiles', JSON.stringify(profiles));
}

function createNewProfile() {
    let name = prompt("Masukkan nama profil baru (misal: Mage DPS, Alt Cleric):");
    if (!name) return;
    name = name.trim();
    if (name === "") return;
    if (profiles[name]) { alert("Nama profil tersebut sudah ada!"); return; }
    
    currentProfile = name;
    saveActiveProfile();
    renderProfileDropdown();
    loadProfileData(name);
    applyLanguage();
}

function removeCurrentProfile() {
    if (currentProfile === 'Default') {
        alert("Profil 'Default' sistem tidak dapat dihapus.");
        return;
    }
    if (confirm(`Apakah Anda yakin ingin menghapus profil "${currentProfile}" beserta seluruh data di dalamnya?`)) {
        delete profiles[currentProfile];
        localStorage.setItem('tomeProfiles', JSON.stringify(profiles));
        currentProfile = 'Default';
        loadProfileData('Default');
        renderProfileDropdown();
        applyLanguage();
    }
}

function exportProfilesData() {
    const dataStr = JSON.stringify(profiles, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = "Tome-Profiles-Backup.json"; 
    document.body.appendChild(a);
    a.click();
    
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function importProfilesData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (typeof importedData === 'object' && importedData !== null) {
                profiles = { ...profiles, ...importedData };
                localStorage.setItem('tomeProfiles', JSON.stringify(profiles));
                
                renderProfileDropdown();
                loadProfileData(currentProfile);
                applyLanguage();
                alert(currentLang === 'id' ? "Data profil berhasil diimpor!" : "Profile data imported successfully!");
            } else {
                alert(currentLang === 'id' ? "Format file tidak valid!" : "Invalid file format!");
            }
        } catch (err) {
            alert(currentLang === 'id' ? "Gagal membaca file JSON!" : "Failed to read JSON file!");
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

window.onload = () => {
    initProfiles(); 
    loadFromHash(); 
    applyLanguage(); 
    document.getElementById('modalInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') confirmModal(); });
};
</script>
