  }

  }

    gap: 10px;
  }

    color: var(--text-color); 
    border: 1px solid #45475a; 
    border-radius: 20px; 
    padding: 8px 16px;

    font-weight: 600; 
    cursor: pointer;

  .action-buttons button:hover {

  }

    border-color: var(--danger-color);

  }

  }

  }

  .tab-btn {

    border: none; 
    color: var(--text-muted); 
    font-size: 16px; 
    font-family: var(--font-family); 
    font-weight: 600; 
    padding: 12px 5px; 
    cursor: pointer; 
    position: relative;

  .tab-btn:hover {

  }

// --- MODAL POPUP SUBTRACT DIALOG ---
var oknoDiv = document.getElementById('okno'); var oknoInput = document.getElementById('okno_input');
function okno(e, t) { oknoDiv.style.display = 'flex'; document.getElementById('okno_icon').style = sdvig(e); document.getElementById('okno_nazv').innerHTML = i[e][4]; document.getElementById('okno_ok').onclick = function() { var uje = oknoInput.value * 1; if (uje > 0) { if (!vychet[e]) vychet[e] = 0; vychet[e] += uje; zachest(e, true); } }; }
function okno_close() { oknoDiv.style.display = 'none'; }

function zachest(e, k) { okno_close(); if (!k) { vychet[e] = 0; } vychtennoe(); drevo(derevo); drevo(vetka, true); }

function shelk(t) { var e = t.parentNode.getElementsByTagName('span')[0].title; var uje = t.value * 1; if (uje > 0) { if (!vychet[e]) vychet[e] = 0; vychet[e] += uje; zachest(e, true); }}

// --- PENYELARASAN LINK KLIK PANEL TREE KE PANEL CABANG (RESTORED FUNCTIONAL) ---
function w_html(e) { 
  var deystv = 'onClick="shelk(this)"'; 
  var spanDeystv = 'onClick="mnojInput.value=\'' + schet[e] + '\'; drevo(' + e + ', true);"';  
  if (e == 12 || e == 11 || e == 10) { deystv = ''; spanDeystv = ''; }  
  var itemName = i[e] ? i[e][4] : 'Unknown Item';  
  return '<li>' + '<button class="icon-btn" style="' + sdvig(e) + '" value="' + schet[e] + '" title="' + e + '" ' + deystv + ' onMouseOver="nazv(this);"></button>' + '<span class="item-name clickable-text" ' + spanDeystv + ' title="' + e + '" onMouseOver="nazv(this);">' + itemName + '</span>' + '<b>×' + schet[e] + '</b>' + '<button class="action-btn" onClick="okno(' + e + ',this);" title="Tandai sudah punya (Subtract)">↺</button>' + '</li>';
}

function vychtennoe_html(e) { 
  var deystv = 'onClick="shelk(this)"'; 
  var spanDeystv = 'onClick="mnojInput.value=\'' + vychet[e] + '\'; drevo(' + e + ', true);"';  
  if (e == 12 || e == 11 || e == 10) { deystv = ''; spanDeystv = ''; }  
  var itemName = i[e] ? i[e][4] : 'Unknown Item';
  return '<li>' + '<button class="icon-btn" style="' + sdvig(e) + '" value="' + vychet[e] + '" title="' + e + '" ' + deystv + ' onMouseOver="nazv(this);"></button>' + '<span class="item-name clickable-text" ' + spanDeystv + ' title="' + e + '" onMouseOver="nazv(this);">' + itemName + '</span>' + '<b>×' + vychet[e] + '</b>' + '<button class="action-btn danger" onClick="zachest(' + e + ');" title="Hapus dari daftar subtract">✕</button>' + '</li>';
}

function vychtennoe() { 
  var txt = ''; var lis = ''; 
  if (vychet[11]) lis += vychtennoe_html(11); 
  if (vychet[12]) lis += vychtennoe_html(12); 
  if (vychet[10]) lis += vychtennoe_html(10);  
  if (lis != '') txt += '<div class="row-level"><h4>Material Dasar</h4><ul class="grid-mode"> ' + lis + '</ul></div>';  
  for (var r = 1; r <= 6; r++) { 
    lis = ''; var nach = r * 100 + 1; var konec = r * 100 + 16; 
    for (var e = nach; e <= konec; e++) { if (vychet[e]) { lis += vychtennoe_html(e); } } 
    if (lis != '') txt += '<div class="row-level"><h4>Level ' + r + '</h4><ul class="grid-mode"> ' + lis + '</ul></div>'; 
  }  
  vychetDiv.innerHTML = txt; 
  if(txt != '') { vychetContainer.style.display = 'flex'; } else { vychetContainer.style.display = 'none'; }
}

function okno_vybora() { 
  var txt = ''; 
  for (var r = 6; r >= 1; r--) { 
    var lis = ''; var nach = r * 100 + 1; var konec = r * 100 + 16; 
    for (var e = nach; e <= konec; e++) { 
      if (i[e]) { lis += '<li>' + '<button class="icon-btn" style="' + sdvig(e) + '" title="' + e + '" onClick="drevo(this.title)" onMouseOver="nazv(this);"></button>' + '<span class="item-name clickable-text" onClick="drevo(' + e + ')" onMouseOver="nazv({title: ' + e + '});">' + i[e][4] + '</span>' + '</li>'; } 
    } 
    txt += '<div class="row-level"><h4>Level ' + r + '</h4><ul class="grid-mode"> ' + lis + '</ul></div>'; 
  } 
  vyborDiv.innerHTML = txt;
} 
okno_vybora();

function w() { 
  var txt = ''; 
  for (var r = 6; r >= 1; r--) { 
    var lis = ''; var nach = r * 100 + 1; var konec = r * 100 + 16; 
    for (var e = nach; e <= konec; e++) { if (schet[e]) { lis += w_html(e); } } 
    if (lis != '') txt += '<div class="row-level"><h4>Level ' + r + '</h4><ul ' + (rawr ? 'class="grid-mode"' : '') + '>' + lis + '</ul></div>'; 
  }  
  var nizLis = ''; 
  if (schet[11]) nizLis += w_html(11); 
  if (schet[12]) nizLis += w_html(12); 
  if (schet[10]) nizLis += w_html(10);  
  if (nizLis != '') txt += '<div class="row-level"><h4>Material Dasar</h4><ul ' + (rawr ? 'class="grid-mode"' : '') + '>' + nizLis + '</ul></div>';
  document.getElementById(rawr ? 'rawrRawr' : 'rawr').innerHTML = txt;
}

function reDrevo(e) { 
  if (!schet[e]) schet[e] = 0; 
  if (vychetCopy[e] && vychetCopy[e] > 0) vychetCopy[e]--; 
  else { 
    schet[e]++; 
    if (e > 200) { reDrevo(i[e][0]); reDrevo(i[e][1]); reDrevo(i[e][2]); } 
  }
}

function drevo(e, k) { 
  rawr = k; mnoj = 1; schet = []; str = ''; vychetCopy = vychet.slice(); 
  if (rawr) { vetka = e; mnoj = mnojInput.value * 1; if (vychet[e]) mnoj += vychet[e]; } else derevo = e;  
  for (var z = 1; z <= mnoj; z++) reDrevo(e);  
  var znach = 0; 
  for (var z = 101; z <= 109; z++) if (schet[z]) znach += schet[z] * 3; 
  for (var z = 12; z >= 10; z--) { 
    switch (z) { case 10: schet[10] = schet[12] * 80; break; default: schet[z] = znach; break; } 
    if (vychet[z]) schet[z] -= vychet[z] * 1; 
    if (schet[z] < 0) schet[z] = 0; 
  } 
  w();
}

// --- FUNGSI RESET AMAN (TANPA REFRESH) ---
function resetCalculator() {
  vychet = [];
  vychetCopy = [];
  mnojInput.value = 1;
  vchtennoe();
  drevo(derevo);
  drevo(vetka, true);
}

// Inisialisasi awal pohon material
drevo(616);
drevo(515, true);

// --- FITUR TEMA (DARK/LIGHT MODE) ---
function toggleTheme() { 
  const body = document.documentElement; 
  const btn = document.getElementById('themeToggle');  
  if (body.getAttribute('data-theme') === 'light') { 
    body.removeAttribute('data-theme'); 
    btn.innerHTML = '☀️ Light Mode'; 
  } else { 
    body.setAttribute('data-theme', 'light'); 
    btn.innerHTML = '🌙 Dark Mode'; 
  }
}

// --- FITUR ALIH BAHASA (TRANSLATION) LENGKAP ---
let isIndo = true;
function toggleLang() { 
  isIndo = !isIndo; 
  const langBtn = document.getElementById('langToggle');  
  const textDict = { 
    descText: isIndo ? "Hitung kebutuhan bahan craft Tome." : "Calculate Tome crafting materials.", 
    cardTitle1: isIndo ? "Full Material Tree" : "Pohon Material Lengkap", 
    cardTitle2: isIndo ? "Individual Branch" : "Cabang Individu", 
    cardTitle3: isIndo ? "Sudah Dimiliki (Subtracted)" : "Already Owned (Subtracted)", 
    cardTitle4: isIndo ? "Tome Selection Database" : "Basis Data Pilihan Tome",
    selectPlaceholder: isIndo ? "Pilih buku..." : "Select book...",
    modalTitle: isIndo ? "Masukkan Jumlah Item yang Sudah Anda Miliki:" : "Enter the Number of Items You Already Own:"
  };
  
  langBtn.innerHTML = isIndo ? 'Bahasa' : 'English'; 
  document.getElementById('desc-text').innerText = textDict.descText;  
  
  if(nazvDiv.innerText === "Pilih buku..." || nazvDiv.innerText === "Select book...") {
     nazvDiv.innerText = textDict.selectPlaceholder;
  }
  
  const modalLabel = document.querySelector('.modal-input-group label');
  if(modalLabel) modalLabel.innerText = textDict.modalTitle;

  const headers = document.querySelectorAll('.card-title-group h2'); 
  if(headers.length >= 4) { 
    headers[0].innerText = textDict.cardTitle1; 
    headers[1].innerText = textDict.cardTitle2; 
    headers[2].innerText = textDict.cardTitle3; 
    headers[3].innerText = textDict.cardTitle4; 
  } 
}
</script>
